# This configuration file tells Netlify how to build and serve your site.
[build]
  # The command to build your site. We use yarn as per the project setup.
  command = "yarn build"
  # The directory that contains the built site. Vite's default is 'dist'.
  publish = "dist"

# The following rule is crucial for Single-Page Applications (SPAs).
# It ensures that any direct URL request is redirected to the main index.html file,
# allowing React Router to handle the routing on the client side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
