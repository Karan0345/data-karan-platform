# This file configures the build and redirect settings for Netlify.

[build]
  # Specifies the command to build the project. We use 'yarn build' as defined in package.json.
  command = "yarn build"
  # Specifies the directory that contains the built project. Vite's default is 'dist'.
  publish = "dist"

[[redirects]]
  # This rule is the key to fixing the 404 error for single-page applications.
  # It tells Netlify to redirect all requests...
  from = "/*"
  # ...to the main index.html file.
  to = "/index.html"
  # It serves the index.html with a 200 status (OK), allowing React Router to handle the URL.
  status = 200
