# This configuration file tells Netlify how to build and serve your site.
# It's crucial for Single-Page Applications (SPAs) like React.

[build]
  # This command tells Netlify to use your project's build script.
  command = "yarn build"
  # This is the directory where your built site is located. Vite places it in 'dist'.
  publish = "dist"

[[redirects]]
  # This is the "catch-all" rule for SPAs.
  # It tells Netlify that for any path that doesn't match a file on the server...
  from = "/*"
  # ...it should serve the index.html file instead.
  to = "/index.html"
  # The status 200 means it serves the file directly, not as a redirect.
  status = 200
